#
# /etc/geoclue/conf.d/90-titan2-gnss.conf (titan2-gnss)
# GeoClue reads NMEA from t2-gnssd's socket; it connects only while an application
# needs a location, and t2-gnssd starts the receiver on that connection.
[network-nmea]
enable=true
nmea-socket=/run/t2-gnss/nmea.sock
